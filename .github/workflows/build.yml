name: Build MoniShort APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK; only the licenses must be accepted
      # so Gradle can download the compile SDK platform it needs.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MoniShort-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Unit tests
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Publish APK as GitHub release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest app/build/outputs/apk/debug/app-debug.apk \
            --prerelease \
            --title "MoniShort debug build" \
            --notes "Automatically built from commit ${GITHUB_SHA}. Debug-signed, for testing only."
